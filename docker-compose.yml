services:
  carburanti:
    build: .
    container_name: prezzi-carburanti-montagne-paesi
    restart: unless-stopped
    ports:
      - "8087:8080"
    volumes:
      - carburanti_data:/app/data
    environment:
      WP_URL: "${WP_URL}"
      WP_USERNAME: "${WP_USERNAME}"
      WP_APP_PASSWORD: "${WP_APP_PASSWORD}"
      WP_POST_STATUS: "${WP_POST_STATUS:-draft}"
      WP_CATEGORY_ID: "${WP_CATEGORY_ID:-1869}"
      WP_AUTHOR_ID: "${WP_AUTHOR_ID:-}"
      PUBLISH_TIME: "${PUBLISH_TIME:-09:30}"
      AUTOMATION_ENABLED: "${AUTOMATION_ENABLED:-false}"
      TOP_COUNT: "${TOP_COUNT:-5}"
      MAX_PRICE_AGE_DAYS: "${MAX_PRICE_AGE_DAYS:-8}"
      TZ: "${TZ:-Europe/Rome}"
      SECRET_KEY: "${SECRET_KEY}"
      PORT: "8080"
volumes:
  carburanti_data:
